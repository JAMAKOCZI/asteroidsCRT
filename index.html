    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const livesElement = document.getElementById('lives');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const gameOverText = document.getElementById('gameOverText');
        const initialsPrompt = document.getElementById('initialsPrompt');
        const initialsDisplay = document.getElementById('initialsDisplay');
        const leaderboard = document.getElementById('leaderboard');
        const leaderboardList = document.getElementById('leaderboardList');
        const restartPrompt = document.getElementById('restartPrompt');

        const MAX_SHIP_SPEED = 8;
        const TARGET_FPS = 60;
        const EXTRA_LIFE_EVERY = 10000;
        const MAX_MISSILES = 4;
        const MAX_MISSILES_RAPID = 7;
        const HYPERSPACE_COOLDOWN = 180; // frames @ 60fps ≈ 3s

        // Classic CRT phosphor palette — cycles every 8 levels
        const CRT_PHOSPHORS = [
            { name: 'Green',      hex: '#00FF66', bg: '#000a04' },
            { name: 'Amber',      hex: '#FFB000', bg: '#0a0700' },
            { name: 'White',      hex: '#E8F0FF', bg: '#05060a' },
            { name: 'Aqua',       hex: '#00E5C8', bg: '#000a09' },
            { name: 'Orange-red', hex: '#FF5A2A', bg: '#0a0302' },
            { name: 'Ice blue',   hex: '#6AB0FF', bg: '#02040a' },
            { name: 'Chartreuse', hex: '#C8FF40', bg: '#060a00' },
            { name: 'Magenta',    hex: '#FF55C8', bg: '#0a0208' }
        ];

        let crtTheme = {
            name: CRT_PHOSPHORS[0].name,
            hex: CRT_PHOSPHORS[0].hex,
            bg: CRT_PHOSPHORS[0].bg,
            r: 0, g: 255, b: 102,
            dim: '#00aa44',
            dimR: 0, dimG: 170, dimB: 68
        };

        function hexToRgb(hex) {
            const h = String(hex).replace('#', '');
            return {
                r: parseInt(h.slice(0, 2), 16),
                g: parseInt(h.slice(2, 4), 16),
                b: parseInt(h.slice(4, 6), 16)
            };
        }

        function phosphorForLevel(level) {
            const n = CRT_PHOSPHORS.length;
            const i = ((Math.max(1, level | 0) - 1) % n + n) % n;
            return CRT_PHOSPHORS[i];
        }

        function applyCrtTheme(level) {
            const p = phosphorForLevel(level == null ? 1 : level);
            const rgb = hexToRgb(p.hex);
            const dimR = Math.round(rgb.r * 0.55);
            const dimG = Math.round(rgb.g * 0.55);
            const dimB = Math.round(rgb.b * 0.55);
            const dim = 'rgb(' + dimR + ',' + dimG + ',' + dimB + ')';
            crtTheme = {
                name: p.name,
                hex: p.hex,
                bg: p.bg,
                r: rgb.r, g: rgb.g, b: rgb.b,
                dim: dim,
                dimR: dimR, dimG: dimG, dimB: dimB
            };
            const host = document.querySelector('.crt-computer');
            if (host) {
                host.style.setProperty('--crt-hex', p.hex);
                host.style.setProperty('--crt-r', String(rgb.r));
                host.style.setProperty('--crt-g', String(rgb.g));
                host.style.setProperty('--crt-b', String(rgb.b));
                host.style.setProperty('--crt-dim', dim);
            }
        }

        function crtRgba(alpha) {
            return 'rgba(' + crtTheme.r + ',' + crtTheme.g + ',' + crtTheme.b + ',' + alpha + ')';
        }

        // --- localStorage ---
        function loadLeaderboard() {
            try {
                const data = JSON.parse(localStorage.getItem('asteroidsLeaderboard') || '[]');
                if (!Array.isArray(data)) return [];
                return data
                    .map(function (row) {
                        if (!row || typeof row !== 'object') return null;
                        const initials = String(row.initials || '')
                            .toUpperCase()
                            .replace(/[^A-Z]/g, '')
                            .slice(0, 3);
                        const score = Number(row.score);
                        if (!initials || !Number.isFinite(score) || score < 0) return null;
                        return { initials: initials, score: Math.floor(score) };
                    })
                    .filter(Boolean)
                    .sort(function (a, b) { return b.score - a.score; })
                    .slice(0, 10);
            } catch (e) {
                return [];
            }
        }

        function saveLeaderboard(entries) {
            try {
                localStorage.setItem('asteroidsLeaderboard', JSON.stringify(entries));
            } catch (e) { /* private mode / quota */ }
        }

        function qualifiesForHighScore(score) {
            if (score <= 0) return false;
            const board = gameState.leaderboard;
            if (board.length < 10) return true;
            // Ties with the 10th place still qualify
            return score >= board[board.length - 1].score;
        }

        // Game state — mode: title | playing | paused | gameover
        let gameState = {
            mode: 'title',
            lives: 3,
            score: 0,
            level: 1,
            gameOver: false,
            enteringInitials: false,
            initials: '',
            leaderboard: loadLeaderboard(),
            nextExtraLife: EXTRA_LIFE_EVERY,
            message: '',
            messageTimer: 0
        };

        let lastFrameTime = 0;
        let lastThrustSound = 0;

        // --- Web Audio ---
        let audioCtx = null;

        function ensureAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, duration, type, volume) {
            const ctxA = ensureAudio();
            if (!ctxA) return;
            const osc = ctxA.createOscillator();
            const gain = ctxA.createGain();
            osc.type = type || 'square';
            osc.frequency.value = freq;
            const now = ctxA.currentTime;
            const vol = volume == null ? 0.04 : volume;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(ctxA.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        function playNoise(duration, volume) {
            const ctxA = ensureAudio();
            if (!ctxA) return;
            const len = Math.max(1, Math.floor(ctxA.sampleRate * duration));
            const buffer = ctxA.createBuffer(1, len, ctxA.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / len);
            }
            const src = ctxA.createBufferSource();
            src.buffer = buffer;
            const gain = ctxA.createGain();
            gain.gain.value = volume == null ? 0.06 : volume;
            src.connect(gain);
            gain.connect(ctxA.destination);
            src.start();
        }

        function sfxShoot() { playTone(720, 0.05, 'square', 0.03); }
        function sfxExplode() { playNoise(0.18, 0.07); }
        function sfxDeath() { playNoise(0.28, 0.09); playTone(90, 0.25, 'sawtooth', 0.04); }
        function sfxAlienHit() { playTone(520, 0.08, 'square', 0.05); playTone(780, 0.1, 'square', 0.04); }
        function sfxExtraLife() { playTone(440, 0.08, 'square', 0.05); playTone(660, 0.1, 'square', 0.05); playTone(880, 0.12, 'square', 0.05); }
        function sfxHyperspace() { playTone(200, 0.15, 'sawtooth', 0.04); playNoise(0.12, 0.04); }
        function sfxPowerup() { playTone(600, 0.06, 'square', 0.04); playTone(900, 0.1, 'square', 0.04); }
        function sfxThrust() {
            const now = performance.now();
            if (now - lastThrustSound < 80) return;
            lastThrustSound = now;
            playNoise(0.06, 0.015);
        }

        // --- Input ---
        const keys = {};

        function clearHeldKeys() {
            for (const k of Object.keys(keys)) {
                keys[k] = false;
            }
            keys.spacePressed = false;
            keys.rapidAcc = 0;
        }

        function isModifierOnlyOrBrowserChord(e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return true;
            const c = e.code;
            return (
                c === 'Tab' ||
                c === 'Escape' ||
                c === 'CapsLock' ||
                c === 'NumLock' ||
                c === 'ScrollLock' ||
                c === 'ShiftLeft' || c === 'ShiftRight' ||
                c === 'ControlLeft' || c === 'ControlRight' ||
                c === 'AltLeft' || c === 'AltRight' ||
                c === 'MetaLeft' || c === 'MetaRight' ||
                c === 'ContextMenu' ||
                (c.length >= 2 && c[0] === 'F' && c[1] >= '0' && c[1] <= '9')
            );
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
                e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
                e.preventDefault();
            }

            if (gameState.mode === 'title') {
                if (isModifierOnlyOrBrowserChord(e)) return;
                ensureAudio();
                startGame();
                return;
            }

            if (gameState.enteringInitials) {
                handleInitialsInput(e);
                return;
            }

            if (e.code === 'KeyP' && (gameState.mode === 'playing' || gameState.mode === 'paused')) {
                gameState.mode = gameState.mode === 'playing' ? 'paused' : 'playing';
                return;
            }

            if (gameState.mode === 'playing' && (e.code === 'KeyH' || e.code === 'ArrowDown')) {
                tryHyperspace();
                return;
            }

            if (e.code === 'KeyR' && gameState.gameOver) {
                ensureAudio();
                restartGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        window.addEventListener('blur', clearHeldKeys);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearHeldKeys();
        });

        function isBoosting() {
            return !!(keys['ArrowUp'] || keys['KeyW']);
        }

        function isTurningLeft() {
            return !!(keys['ArrowLeft'] || keys['KeyA']);
        }

        function isTurningRight() {
            return !!(keys['ArrowRight'] || keys['KeyD']);
        }

        // --- Entities ---
        function makeAsteroidVertices(size) {
            const points = 8 + Math.floor(Math.random() * 5);
            const radii = [];
            for (let i = 0; i < points; i++) {
                radii.push(size * (0.7 + Math.random() * 0.4));
            }
            return radii;
        }

        function makeAsteroid(x, y, size, speedMultiplier, speedScale) {
            const scale = speedScale || 2;
            return {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * scale * speedMultiplier,
                vy: (Math.random() - 0.5) * scale * speedMultiplier,
                size: size,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1 * speedMultiplier * (scale > 2 ? 2 : 1),
                vertices: makeAsteroidVertices(size)
            };
        }

        const ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: 0,
            vx: 0,
            vy: 0,
            size: 8,
            boosting: false,
            invulnerable: 0,
            hyperspaceCooldown: 0,
            rapidFire: 0,
            tripleShot: 0
        };

        let missiles = [];
        let asteroids = [];
        let particles = [];
        let powerups = [];
        let floatScores = [];
        let alienShip = null;
        let alienMissiles = [];

        // --- Scoring / messages ---
        function showMessage(text, frames) {
            gameState.message = text;
            gameState.messageTimer = frames;
        }

        function spawnFloatScore(x, y, pts) {
            floatScores.push({ x: x, y: y, pts: pts, life: 45, maxLife: 45 });
        }

        function addScore(points, x, y) {
            gameState.score += points;
            if (x != null && y != null) spawnFloatScore(x, y, points);
            while (gameState.score >= gameState.nextExtraLife) {
                gameState.lives++;
                gameState.nextExtraLife += EXTRA_LIFE_EVERY;
                showMessage('EXTRA SHIP!', 100);
                sfxExtraLife();
            }
        }

        function asteroidPoints(size) {
            if (size > 30) return 20;   // large
            if (size > 15) return 50;   // medium
            return 100;                // small
        }

        // --- Alien (large / small saucer) ---
        function createAlienShip() {
            if (alienShip) return;
            if (gameState.level < 2) return;

            const side = Math.floor(Math.random() * 4);
            let x, y;
            switch (side) {
                case 0: x = 0; y = Math.random() * canvas.height; break;
                case 1: x = canvas.width; y = Math.random() * canvas.height; break;
                case 2: x = Math.random() * canvas.width; y = 0; break;
                default: x = Math.random() * canvas.width; y = canvas.height; break;
            }

            // Small saucer more common on higher levels (harder, more points)
            const smallChance = Math.min(0.15 + gameState.level * 0.06, 0.65);
            const isSmall = gameState.level >= 4 && Math.random() < smallChance;
            const levelBoost = 1 + (gameState.level - 2) * 0.08;

            alienShip = {
                x: x,
                y: y,
                vx: 0,
                vy: 0,
                type: isSmall ? 'small' : 'large',
                size: isSmall ? 7 : 14,
                speed: (isSmall ? 3.0 : 1.7) * levelBoost,
                scoreValue: isSmall ? 1000 : 200,
                shootInterval: isSmall ? 48 : Math.max(55, 95 - gameState.level * 4),
                aimJitter: isSmall ? 0.08 : 0.45,
                lastShot: 0,
                changeDirection: 0
            };
        }

        // In-game countdown (frames @ TARGET_FPS). Decrements only while playing,
        // so pause freezes it and restarts replace the schedule instead of stacking.
        let alienSpawnTimer = 0;

        function scheduleAlienSpawn(minMs, maxMs) {
            if (gameState.level < 2) {
                alienSpawnTimer = 0;
                return;
            }
            const minF = (minMs / 1000) * TARGET_FPS;
            const maxF = (maxMs / 1000) * TARGET_FPS;
            alienSpawnTimer = minF + Math.random() * (maxF - minF);
        }

        function tickAlienSpawn(f) {
            if (alienShip || gameState.level < 2) return;
            if (alienSpawnTimer <= 0) return;
            alienSpawnTimer -= f;
            if (alienSpawnTimer <= 0) {
                alienSpawnTimer = 0;
                createAlienShip();
            }
        }

        function updateAlienShip(f) {
            if (!alienShip) return;
            f = f == null ? 1 : f;

            const dx = ship.x - alienShip.x;
            const dy = ship.y - alienShip.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (alienShip.changeDirection <= 0) {
                const targetAngle = Math.atan2(dy, dx);
                const randomOffset = (Math.random() - 0.5) * Math.PI * (alienShip.type === 'small' ? 0.2 : 0.45);
                const angle = targetAngle + randomOffset;
                alienShip.vx = Math.cos(angle) * alienShip.speed;
                alienShip.vy = Math.sin(angle) * alienShip.speed;
                alienShip.changeDirection = (alienShip.type === 'small' ? 40 : 55) + Math.random() * 40;
            } else {
                alienShip.changeDirection -= f;
            }

            alienShip.x += alienShip.vx * f;
            alienShip.y += alienShip.vy * f;
            wrap(alienShip);

            alienShip.lastShot += f;
            const range = alienShip.type === 'small' ? 420 : 340;
            if (alienShip.lastShot > alienShip.shootInterval && distance < range) {
                const base = Math.atan2(dy, dx);
                const shootAngle = base + (Math.random() - 0.5) * alienShip.aimJitter * Math.PI;
                const bulletSpeed = alienShip.type === 'small' ? 5.2 : 3.8;
                alienMissiles.push({
                    x: alienShip.x,
                    y: alienShip.y,
                    vx: Math.cos(shootAngle) * bulletSpeed,
                    vy: Math.sin(shootAngle) * bulletSpeed,
                    life: 130
                });
                alienShip.lastShot = 0;
            }
        }

        function createAsteroids() {
            asteroids = [];
            const baseCount = 4;
            const asteroidCount = Math.floor(baseCount * Math.pow(1.22, gameState.level - 1));
            const speedMultiplier = Math.pow(1.12, gameState.level - 1);

            for (let i = 0; i < asteroidCount; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.sqrt((x - ship.x) ** 2 + (y - ship.y) ** 2) < 120);

                asteroids.push(makeAsteroid(x, y, 40, speedMultiplier, 2));
            }
        }

        function createMissile(x, y, angle) {
            // Classic Asteroids: shots inherit ship velocity so they leave the nose at speed
            return {
                x: x,
                y: y,
                vx: Math.cos(angle) * 8 + ship.vx,
                vy: Math.sin(angle) * 8 + ship.vy,
                life: 60
            };
        }

        function createParticles(x, y, count) {
            count = count == null ? 8 : count;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 30,
                    maxLife: 30
                });
            }
        }

        function wrap(obj) {
            const w = canvas.width;
            const h = canvas.height;
            obj.x = ((obj.x % w) + w) % w;
            obj.y = ((obj.y % h) + h) % h;
        }

        function checkCollision(obj1, obj2, radius1, radius2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            return Math.sqrt(dx * dx + dy * dy) < radius1 + radius2;
        }

        function positionIsDangerous(x, y) {
            const probe = { x: x, y: y };
            for (let i = 0; i < asteroids.length; i++) {
                if (checkCollision(probe, asteroids[i], ship.size, asteroids[i].size)) return true;
            }
            if (alienShip && checkCollision(probe, alienShip, ship.size, alienShip.size)) return true;
            return false;
        }

        function breakAsteroid(asteroid) {
            const pieces = [];
            if (asteroid.size > 15) {
                const newSize = asteroid.size / 2;
                const speedMultiplier = Math.pow(1.12, gameState.level - 1);
                for (let i = 0; i < 2; i++) {
                    const piece = makeAsteroid(
                        asteroid.x + (Math.random() - 0.5) * 20,
                        asteroid.y + (Math.random() - 0.5) * 20,
                        newSize,
                        speedMultiplier,
                        3
                    );
                    piece.rotationSpeed = (Math.random() - 0.5) * 0.2 * speedMultiplier;
                    pieces.push(piece);
                }
            }
            createParticles(asteroid.x, asteroid.y, 6);

            // Chance to drop power-up from larger rocks
            if (asteroid.size > 20 && Math.random() < 0.14) {
                spawnPowerup(asteroid.x, asteroid.y);
            }
            return pieces;
        }

        function spawnPowerup(x, y) {
            const types = ['shield', 'rapid', 'triple'];
            powerups.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                type: types[Math.floor(Math.random() * types.length)],
                life: 420,
                size: 10
            });
        }

        function applyPowerup(type) {
            sfxPowerup();
            if (type === 'shield') {
                ship.invulnerable = Math.max(ship.invulnerable, 240);
                showMessage('SHIELD', 70);
            } else if (type === 'rapid') {
                ship.rapidFire = 360;
                showMessage('RAPID FIRE', 70);
            } else if (type === 'triple') {
                ship.tripleShot = 360;
                showMessage('TRIPLE SHOT', 70);
            }
        }

        function firePlayerMissiles() {
            const maxM = ship.rapidFire > 0 ? MAX_MISSILES_RAPID : MAX_MISSILES;
            if (missiles.length >= maxM) return;

            const angles = ship.tripleShot > 0
                ? [ship.angle - 0.22, ship.angle, ship.angle + 0.22]
                : [ship.angle];

            for (let i = 0; i < angles.length; i++) {
                if (missiles.length >= maxM) break;
                missiles.push(createMissile(
                    ship.x + Math.cos(angles[i]) * 12,
                    ship.y + Math.sin(angles[i]) * 12,
                    angles[i]
                ));
            }
            sfxShoot();
        }

        function tryHyperspace() {
            if (ship.hyperspaceCooldown > 0 || gameState.mode !== 'playing') return;

            createParticles(ship.x, ship.y, 14);
            sfxHyperspace();

            ship.x = Math.random() * canvas.width;
            ship.y = Math.random() * canvas.height;
            ship.vx = 0;
            ship.vy = 0;
            ship.hyperspaceCooldown = HYPERSPACE_COOLDOWN;
            ship.boosting = false;

            // Classic risk: landing inside a rock kills you
            if (positionIsDangerous(ship.x, ship.y)) {
                createParticles(ship.x, ship.y, 16);
                killShip();
            } else {
                createParticles(ship.x, ship.y, 10);
                ship.invulnerable = Math.max(ship.invulnerable, 30);
            }
        }

        function killShip() {
            gameState.lives--;
            createParticles(ship.x, ship.y, 14);
            sfxDeath();
            ship.rapidFire = 0;
            ship.tripleShot = 0;
            if (gameState.lives <= 0) {
                endGame();
            } else {
                resetShip();
            }
        }

        function nextLevel() {
            gameState.level++;
            gameState.lives++;
            applyCrtTheme(gameState.level);
            const ph = phosphorForLevel(gameState.level);
            showMessage('LEVEL ' + gameState.level + ' · ' + ph.name.toUpperCase(), 100);
            alienShip = null;
            alienMissiles = [];
            powerups = [];
            // Center ship first so asteroid safe-radius is around the spawn point
            resetShip();
            createAsteroids();
            scheduleAlienSpawn(2000, 4000);
        }

        function endGame() {
            gameState.gameOver = true;
            gameState.mode = 'gameover';
            gameOverElement.style.display = 'block';

            if (qualifiesForHighScore(gameState.score)) {
                gameState.enteringInitials = true;
                gameOverText.textContent = 'HIGH SCORE!';
                initialsPrompt.style.display = 'block';
                restartPrompt.style.display = 'none';
                updateInitialsDisplay();
            } else {
                gameOverText.textContent = 'GAME OVER';
                showLeaderboard();
            }
        }

        function freshRunState(mode) {
            return {
                mode: mode,
                lives: 3,
                score: 0,
                level: 1,
                gameOver: false,
                enteringInitials: false,
                initials: '',
                leaderboard: loadLeaderboard(),
                nextExtraLife: EXTRA_LIFE_EVERY,
                message: '',
                messageTimer: 0
            };
        }

        function clearWorld() {
            missiles = [];
            particles = [];
            powerups = [];
            floatScores = [];
            alienShip = null;
            alienMissiles = [];
            alienSpawnTimer = 0;
        }

        function startGame() {
            gameState = freshRunState('playing');
            clearWorld();
            applyCrtTheme(1);
            resetShip();
            createAsteroids();
            gameOverElement.style.display = 'none';
            initialsPrompt.style.display = 'none';
            leaderboard.style.display = 'none';
            restartPrompt.style.display = 'block';
            showMessage('PLAYER 1', 80);
            updateHud();
            // Level 1: no saucers until level 2 (schedule is a no-op below level 2)
            scheduleAlienSpawn(8000, 14000);
        }

        function restartGame() {
            gameState = freshRunState('playing');
            clearWorld();
            applyCrtTheme(1);
            resetShip();
            createAsteroids();
            gameOverElement.style.display = 'none';
            initialsPrompt.style.display = 'none';
            leaderboard.style.display = 'none';
            restartPrompt.style.display = 'block';
            showMessage('PLAYER 1', 80);
            updateHud();
            scheduleAlienSpawn(8000, 14000);
        }

        function updateHud() {
            livesElement.textContent = gameState.lives;
            scoreElement.textContent = gameState.score;
            levelElement.textContent = gameState.level;
        }

        function handleInitialsInput(e) {
            if (e.code === 'Escape') {
                e.preventDefault();
                gameState.initials = '';
                showLeaderboard();
                return;
            }
            if (e.code === 'Enter') {
                if (gameState.initials.length === 3) {
                    saveHighScore();
                    showLeaderboard();
                } else if (gameState.initials.length === 0) {
                    showLeaderboard();
                }
            } else if (e.code === 'Backspace') {
                gameState.initials = gameState.initials.slice(0, -1);
                updateInitialsDisplay();
            } else if (gameState.initials.length < 3) {
                const key = e.key.toUpperCase();
                if (key.length === 1 && key >= 'A' && key <= 'Z') {
                    gameState.initials += key;
                    updateInitialsDisplay();
                }
            }
        }

        function updateInitialsDisplay() {
            const display = gameState.initials.padEnd(3, '_');
            initialsDisplay.textContent = display.split('').join(' ');
        }

        function saveHighScore() {
            gameState.leaderboard.push({
                initials: gameState.initials,
                score: gameState.score
            });
            gameState.leaderboard.sort((a, b) => b.score - a.score);
            gameState.leaderboard = gameState.leaderboard.slice(0, 10);
            saveLeaderboard(gameState.leaderboard);
        }

        function showLeaderboard() {
            gameState.enteringInitials = false;
            initialsPrompt.style.display = 'none';

            leaderboardList.textContent = '';
            gameState.leaderboard.forEach((entry, index) => {
                const row = document.createElement('div');
                row.textContent = (index + 1) + '. ' + entry.initials + ' - ' + entry.score;
                leaderboardList.appendChild(row);
            });
            leaderboard.style.display = 'block';
            restartPrompt.style.display = 'block';
        }

        function resetShip() {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.vx = 0;
            ship.vy = 0;
            ship.angle = 0;
            ship.invulnerable = 120;
            ship.hyperspaceCooldown = 0;
            ship.boosting = false;
            // Keep power-ups across respawn only if still timed — clear on death already
        }

        function updateTitleAmbient(dt) {
            const f = dt * TARGET_FPS;
            asteroids.forEach(asteroid => {
                asteroid.x += asteroid.vx * f;
                asteroid.y += asteroid.vy * f;
                asteroid.rotation += asteroid.rotationSpeed * f;
                wrap(asteroid);
            });
        }

        function update(dt) {
            if (gameState.mode === 'title') {
                updateTitleAmbient(dt);
                return;
            }
            if (gameState.mode !== 'playing' || gameState.gameOver) return;
            const f = dt * TARGET_FPS;

            tickAlienSpawn(f);

            if (gameState.messageTimer > 0) {
                gameState.messageTimer -= f;
                if (gameState.messageTimer <= 0) {
                    gameState.messageTimer = 0;
                    gameState.message = '';
                }
            }

            if (ship.hyperspaceCooldown > 0) {
                ship.hyperspaceCooldown -= f;
                if (ship.hyperspaceCooldown < 0) ship.hyperspaceCooldown = 0;
            }
            if (ship.rapidFire > 0) {
                ship.rapidFire -= f;
                if (ship.rapidFire < 0) ship.rapidFire = 0;
            }
            if (ship.tripleShot > 0) {
                ship.tripleShot -= f;
                if (ship.tripleShot < 0) ship.tripleShot = 0;
            }

            // Steering
            if (isTurningLeft()) ship.angle -= 0.15 * f;
            if (isTurningRight()) ship.angle += 0.15 * f;

            if (isBoosting()) {
                ship.boosting = true;
                ship.vx += Math.cos(ship.angle) * 0.3 * f;
                ship.vy += Math.sin(ship.angle) * 0.3 * f;
                sfxThrust();
                const thrusterX = ship.x - Math.cos(ship.angle) * 15;
                const thrusterY = ship.y - Math.sin(ship.angle) * 15;
                if (Math.random() < 0.5 * Math.min(f, 1.5)) {
                    particles.push({
                        x: thrusterX + (Math.random() - 0.5) * 4,
                        y: thrusterY + (Math.random() - 0.5) * 4,
                        vx: -Math.cos(ship.angle) * 2 + (Math.random() - 0.5),
                        vy: -Math.sin(ship.angle) * 2 + (Math.random() - 0.5),
                        life: 15,
                        maxLife: 15
                    });
                }
            } else {
                ship.boosting = false;
            }

            if (keys['Space']) {
                if (!keys.spacePressed) {
                    firePlayerMissiles();
                    keys.spacePressed = true;
                } else if (ship.rapidFire > 0) {
                    // Auto-fire while holding Space during rapid power-up
                    if (!keys.rapidAcc) keys.rapidAcc = 0;
                    keys.rapidAcc += f;
                    if (keys.rapidAcc >= 6) {
                        keys.rapidAcc = 0;
                        firePlayerMissiles();
                    }
                }
            } else {
                keys.spacePressed = false;
                keys.rapidAcc = 0;
            }

            // Ship motion
            ship.x += ship.vx * f;
            ship.y += ship.vy * f;
            ship.vx *= Math.pow(0.99, f);
            ship.vy *= Math.pow(0.99, f);

            const shipSpeed = Math.hypot(ship.vx, ship.vy);
            if (shipSpeed > MAX_SHIP_SPEED) {
                ship.vx = (ship.vx / shipSpeed) * MAX_SHIP_SPEED;
                ship.vy = (ship.vy / shipSpeed) * MAX_SHIP_SPEED;
            }
            wrap(ship);

            if (ship.invulnerable > 0) {
                ship.invulnerable -= f;
                if (ship.invulnerable < 0) ship.invulnerable = 0;
            }

            missiles = missiles.filter(missile => {
                missile.x += missile.vx * f;
                missile.y += missile.vy * f;
                wrap(missile);
                missile.life -= f;
                return missile.life > 0;
            });

            updateAlienShip(f);

            alienMissiles = alienMissiles.filter(missile => {
                missile.x += missile.vx * f;
                missile.y += missile.vy * f;
                wrap(missile);
                missile.life -= f;
                return missile.life > 0;
            });

            asteroids.forEach(asteroid => {
                asteroid.x += asteroid.vx * f;
                asteroid.y += asteroid.vy * f;
                asteroid.rotation += asteroid.rotationSpeed * f;
                wrap(asteroid);
            });

            powerups = powerups.filter(p => {
                p.x += p.vx * f;
                p.y += p.vy * f;
                wrap(p);
                p.life -= f;
                return p.life > 0;
            });

            particles = particles.filter(particle => {
                particle.x += particle.vx * f;
                particle.y += particle.vy * f;
                particle.life -= f;
                return particle.life > 0;
            });

            floatScores = floatScores.filter(fs => {
                fs.y -= 0.6 * f;
                fs.life -= f;
                return fs.life > 0;
            });

            // --- Collisions ---
            const missilesToRemove = new Set();
            const asteroidsToRemove = new Set();
            const alienMissilesToRemove = new Set();
            const powerupsToRemove = new Set();
            const splitAsteroids = [];
            let killAlien = false;
            let alienScore = 0;
            let alienX = 0;
            let alienY = 0;

            for (let mi = 0; mi < missiles.length; mi++) {
                if (missilesToRemove.has(mi)) continue;
                for (let ai = 0; ai < asteroids.length; ai++) {
                    if (asteroidsToRemove.has(ai) || missilesToRemove.has(mi)) continue;
                    if (checkCollision(missiles[mi], asteroids[ai], 2, asteroids[ai].size)) {
                        const pts = asteroidPoints(asteroids[ai].size);
                        addScore(pts, asteroids[ai].x, asteroids[ai].y);
                        const pieces = breakAsteroid(asteroids[ai]);
                        if (pieces) splitAsteroids.push(...pieces);
                        sfxExplode();
                        asteroidsToRemove.add(ai);
                        missilesToRemove.add(mi);
                    }
                }
            }

            if (alienShip) {
                for (let mi = 0; mi < missiles.length; mi++) {
                    if (missilesToRemove.has(mi)) continue;
                    if (checkCollision(missiles[mi], alienShip, 2, alienShip.size)) {
                        alienScore = alienShip.scoreValue;
                        alienX = alienShip.x;
                        alienY = alienShip.y;
                        createParticles(alienShip.x, alienShip.y, 12);
                        sfxAlienHit();
                        killAlien = true;
                        missilesToRemove.add(mi);
                        break;
                    }
                }
            }

            // Power-up pickups
            for (let pi = 0; pi < powerups.length; pi++) {
                if (checkCollision(ship, powerups[pi], ship.size, powerups[pi].size)) {
                    applyPowerup(powerups[pi].type);
                    powerupsToRemove.add(pi);
                }
            }

            if (missilesToRemove.size) {
                missiles = missiles.filter((_, i) => !missilesToRemove.has(i));
            }
            if (asteroidsToRemove.size) {
                asteroids = asteroids.filter((_, i) => !asteroidsToRemove.has(i));
            }
            if (splitAsteroids.length) {
                asteroids.push(...splitAsteroids);
            }
            if (powerupsToRemove.size) {
                powerups = powerups.filter((_, i) => !powerupsToRemove.has(i));
            }
            if (killAlien) {
                addScore(alienScore, alienX, alienY);
                alienShip = null;
                scheduleAlienSpawn(5000, 14000);
            }

            // Ship damage: one death per frame
            let diedThisFrame = false;
            if (ship.invulnerable === 0 && !gameState.gameOver) {
                for (let ai = 0; ai < asteroids.length; ai++) {
                    if (checkCollision(ship, asteroids[ai], ship.size, asteroids[ai].size)) {
                        diedThisFrame = true;
                        break;
                    }
                }
                if (!diedThisFrame && alienShip &&
                    checkCollision(ship, alienShip, ship.size, alienShip.size)) {
                    diedThisFrame = true;
                }
                if (!diedThisFrame) {
                    for (let mi = 0; mi < alienMissiles.length; mi++) {
                        if (checkCollision(ship, alienMissiles[mi], ship.size, 2)) {
                            alienMissilesToRemove.add(mi);
                            diedThisFrame = true;
                            break;
                        }
                    }
                }
                if (alienMissilesToRemove.size) {
                    alienMissiles = alienMissiles.filter((_, i) => !alienMissilesToRemove.has(i));
                }
                if (diedThisFrame) {
                    killShip();
                }
            }

            if (asteroids.length === 0 && !gameState.gameOver) {
                nextLevel();
            }

            updateHud();
        }

        function render() {
            const ink = crtTheme.hex;
            ctx.fillStyle = crtTheme.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = ink;
            ctx.fillStyle = ink;
            ctx.lineWidth = 2;

            // Ship
            if (gameState.mode !== 'title' &&
                (ship.invulnerable === 0 || Math.floor(ship.invulnerable / 5) % 2)) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.angle);

                ctx.beginPath();
                ctx.moveTo(12, 0);
                ctx.lineTo(-8, -6);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-8, 6);
                ctx.closePath();
                ctx.stroke();

                if (ship.boosting) {
                    ctx.beginPath();
                    ctx.moveTo(-4, 0);
                    ctx.lineTo(-12, -3);
                    ctx.lineTo(-12, 3);
                    ctx.closePath();
                    ctx.stroke();
                }

                // Shield ring while invulnerable power / respawn
                if (ship.invulnerable > 40) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 16, 0, Math.PI * 2);
                    ctx.strokeStyle = crtRgba(0.45);
                    ctx.stroke();
                    ctx.strokeStyle = ink;
                }

                ctx.restore();
            }

            // Missiles
            missiles.forEach(missile => {
                ctx.beginPath();
                ctx.arc(missile.x, missile.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Alien
            if (alienShip) {
                ctx.save();
                ctx.translate(alienShip.x, alienShip.y);
                const sx = alienShip.type === 'small' ? 0.65 : 1;
                ctx.scale(sx, sx);

                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(0, -2, 8, 3, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(-6, 0, 1, 0, Math.PI * 2);
                ctx.arc(0, 0, 1, 0, Math.PI * 2);
                ctx.arc(6, 0, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Alien missiles — warm contrast vs monochrome phosphor
            alienMissiles.forEach(missile => {
                ctx.fillStyle = '#ff5544';
                ctx.beginPath();
                ctx.arc(missile.x, missile.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = ink;
            });

            // Asteroids
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.rotation);

                const radii = asteroid.vertices || [asteroid.size];
                const points = radii.length;
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const radius = radii[i];
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            });

            // Power-ups (slightly brighter phosphor so they pop)
            powerups.forEach(p => {
                const blink = Math.floor(performance.now() / 120) % 2;
                if (!blink && p.life < 90) return;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.strokeStyle = ink;
                ctx.shadowColor = ink;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = ink;
                ctx.font = '10px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = p.type === 'shield' ? 'S' : (p.type === 'rapid' ? 'R' : 'T');
                ctx.fillText(label, 0, 1);
                ctx.shadowBlur = 0;
                ctx.restore();
                ctx.strokeStyle = ink;
                ctx.fillStyle = ink;
            });

            // Particles
            particles.forEach(particle => {
                const alpha = particle.life / particle.maxLife;
                ctx.fillStyle = crtRgba(alpha);
                ctx.fillRect(particle.x, particle.y, 2, 2);
            });

            // Floating scores
            floatScores.forEach(fs => {
                const alpha = fs.life / fs.maxLife;
                ctx.fillStyle = crtRgba(alpha);
                ctx.font = '12px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('+' + fs.pts, fs.x, fs.y);
            });
            ctx.textAlign = 'left';

            // HUD extras on canvas
            if (gameState.mode === 'playing' || gameState.mode === 'paused') {
                ctx.font = '12px "Courier New", monospace';
                ctx.fillStyle = crtTheme.dim;
                let hudY = 20;
                if (ship.hyperspaceCooldown > 0) {
                    ctx.fillText('HS COOLDOWN', canvas.width - 120, hudY);
                    hudY += 16;
                }
                if (ship.rapidFire > 0) {
                    ctx.fillText('RAPID', canvas.width - 120, hudY);
                    hudY += 16;
                }
                if (ship.tripleShot > 0) {
                    ctx.fillText('TRIPLE', canvas.width - 120, hudY);
                }
            }

            // Center message
            if (gameState.message && gameState.messageTimer > 0 && gameState.mode === 'playing') {
                ctx.fillStyle = ink;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.shadowColor = ink;
                ctx.shadowBlur = 10;
                ctx.fillText(gameState.message, canvas.width / 2, canvas.height / 2 - 80);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            // Title
            if (gameState.mode === 'title') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = ink;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.shadowColor = ink;
                ctx.shadowBlur = 16;
                ctx.fillText('ASTEROIDS', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '20px "Courier New", monospace';
                ctx.shadowBlur = 8;
                ctx.fillText('CRT EDITION', canvas.width / 2, canvas.height / 2 + 10);
                ctx.font = '16px "Courier New", monospace';
                ctx.shadowBlur = 6;
                if (Math.floor(performance.now() / 500) % 2) {
                    ctx.fillText('PRESS A KEY', canvas.width / 2, canvas.height / 2 + 60);
                }
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            // Pause
            if (gameState.mode === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = ink;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.shadowColor = ink;
                ctx.shadowBlur = 12;
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                ctx.font = '14px "Courier New", monospace';
                ctx.shadowBlur = 6;
                ctx.fillText('Press P to resume', canvas.width / 2, canvas.height / 2 + 36);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            let dt = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;
            if (dt > 0.05) dt = 0.05;
            if (dt < 0) dt = 0;

            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        // Scale CRT layout slot to viewport (transform alone does not shrink layout)
        (function setupCrtFit() {
            const fit = document.querySelector('.crt-fit');
            const computer = document.querySelector('.crt-computer');
            if (!fit || !computer) return;

            let nativeW = 0;
            let nativeH = 0;

            function measureNative() {
                // Measure at scale 1; getBoundingClientRect includes transforms
                fit.style.setProperty('--crt-scale', '1');
                fit.style.width = 'auto';
                fit.style.height = 'auto';
                computer.style.position = 'relative';
                computer.style.left = 'auto';
                computer.style.bottom = 'auto';
                computer.style.transform = 'none';
                const r = computer.getBoundingClientRect();
                nativeW = r.width;
                nativeH = r.height;
                computer.style.position = '';
                computer.style.left = '';
                computer.style.bottom = '';
                computer.style.transform = '';
            }

            function fitCrtToViewport() {
                if (!nativeW || !nativeH) measureNative();
                if (!nativeW || !nativeH) return;
                // Desk + apron sit under the CRT; leave room so they stay on-screen
                const deskReserve = 110;
                const availW = window.innerWidth * 0.96;
                const availH = Math.max(160, window.innerHeight - deskReserve - 20);
                const s = Math.min(1, availW / nativeW, availH / nativeH);
                fit.style.setProperty('--crt-scale', String(s));
                fit.style.width = Math.round(nativeW * s) + 'px';
                fit.style.height = Math.round(nativeH * s) + 'px';
            }

            requestAnimationFrame(function () {
                measureNative();
                fitCrtToViewport();
            });
            window.addEventListener('resize', fitCrtToViewport);
        })();

        // Boot: title with drifting rocks + default P1 green phosphor
        applyCrtTheme(1);
        createAsteroids();
        resetShip();
        ship.invulnerable = 0;
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
